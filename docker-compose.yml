services:
  db:
    image: postgres:16-alpine
    container_name: kanei-crm-mvp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: kanei_crm_mvp
      POSTGRES_USER: kanei
      POSTGRES_PASSWORD: local_only_dev
    volumes:
      - kanei_crm_mvp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanei -d kanei_crm_mvp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kanei_crm_mvp_pgdata:
    name: kanei_crm_mvp_pgdata
